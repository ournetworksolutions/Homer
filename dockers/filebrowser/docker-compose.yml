services:  # ==========================================  # 1. PUBLIC INSTANCE (No Password)  # ==========================================  filebrowser-public:    image: filebrowser/filebrowser    container_name: filebrowser_public    user: "1000:1000"    ports:      - "8182:80" # Accessible on port 8182    volumes:      # CRITICAL: They MUST have separate database & config folders      - ./database-public:/database      - ./config-public:/config      # The folder you want to share publicly      - /run/media/main/Cloud/Public:/srv    restart: unless-stopped    command: --noauth  # ==========================================  # 2. PRIVATE INSTANCE (Requires Password)  # ==========================================  filebrowser-private:    image: filebrowser/filebrowser    container_name: filebrowser_private    user: "1000:1000"    ports:      - "10.10.10.10:8183:80" # Accessible on a DIFFERENT port (8183)    volumes:      # CRITICAL: Separate database & config folders      - ./database-private:/database      - ./config-private:/config      # The folder you want for your private use (e.g., the root cloud folder)      - /run/media/main/Cloud/Private:/srv     restart: unless-stopped    # Notice: NO command line here. By default, it requires authentication.